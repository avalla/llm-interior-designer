name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Structure, scorer, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: pipx run ruff check .
      - name: Repository structure (skills, fixtures, Markdown links)
        run: python ci/check_repo.py
      - name: Review scorer unit test
        run: python ci/test_score_review.py

  desktop:
    name: Desktop shell (UI build, Rust tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: UI build (TypeScript check + Vite)
        working-directory: app/desktop
        run: npm ci && npm run build
      - name: Shell tests (sidecar bridge)
        working-directory: app/desktop/src-tauri
        run: cargo test --lib

  engine:
    name: Engine regression (headless FreeCAD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: freecad
          # Pinned to the stable release closest to the tested local build (1.1.4 is not on conda-forge);
          # unpinned, conda-forge resolves to the weekly dev builds (2026.x).
          create-args: freecad=1.1.3 python=3.11 shapely ezdxf
          init-shell: bash
          cache-environment: true
      - name: Run engine eval and example projects
        run: |
          FCCMD=$(command -v freecadcmd || command -v FreeCADCmd)
          "$FCCMD" --version
          INTERIORS_ROOT="$PWD" "$FCCMD" ci/engine_ci.py
      - name: Assert results
        run: python ci/assert_engine.py
      - name: App core parity (projects, fixtures and shifted-furniture mutants)
        run: |
          FCCMD=$(command -v freecadcmd || command -v FreeCADCmd)
          MUTANTS=1 INTERIORS_ROOT="$PWD" "$FCCMD" app/tools/export_model.py > /dev/null
          python app/tests/parity.py
      - name: App plan import end to end (studio-style DXF -> recognition -> semantics -> checks)
        run: |
          python app/tests/import_e2e.py
          python app/tests/import_mutants.py
          python app/tests/sidecar_smoke.py
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-eval
          path: |
            evals/results/engine.md
            ci/engine_result.json
          if-no-files-found: ignore
