name: Package

# Windows installer of the desktop app (docs/desktop-app.md, section 7): the Python sidecar frozen with PyInstaller
# into one interiors-sidecar.exe, smoke-tested, then bundled by Tauri next to the app in an NSIS installer.
# The installer is the run's artifact "interior-check-windows". Unsigned: Windows SmartScreen asks once
# ("More info" -> "Run anyway"). DWG files need the ODA File Converter on the user's PC; DXF works without it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Sidecar (PyInstaller, one file)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ezdxf shapely
          pyinstaller --onefile --name interiors-sidecar --paths . --paths app/core --collect-data ezdxf \
            --noconfirm app/sidecar/server.py
          mkdir -p app/desktop/src-tauri/binaries
          cp dist/interiors-sidecar.exe \
            "app/desktop/src-tauri/binaries/interiors-sidecar-$(rustc -vV | sed -n 's/^host: //p').exe"
      - name: Smoke test of the packaged sidecar (one room drawn on the spot)
        shell: pwsh
        run: |
          $env:INTERIORS_SIDECAR = "$PWD\dist\interiors-sidecar.exe"
          python app/tests/sidecar_smoke.py
      - name: Installer (Tauri, NSIS)
        working-directory: app/desktop
        shell: bash
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: interior-check-windows
          path: app/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
